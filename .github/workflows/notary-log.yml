name: Notarization Log

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: Apple notarization submission ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  log:
    name: Retrieve Apple notarization log
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Prepare notarization key
        env:
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_BASE64" \
            | /usr/bin/base64 -D >"$key_path"
          chmod 600 "$key_path"
          printf 'APPLE_NOTARY_KEY_PATH=%s\n' "$key_path" >>"$GITHUB_ENV"

      - name: Retrieve notarization log
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          log_path="$RUNNER_TEMP/notary-log.json"
          xcrun notarytool log "${{ inputs.submission_id }}" "$log_path" \
            --key "$APPLE_NOTARY_KEY_PATH" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID"
          /bin/cat "$log_path"

      - name: Remove notarization key
        if: always()
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          if [[ -n "$APPLE_NOTARY_KEY_ID" ]]; then
            rm -f "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          fi
